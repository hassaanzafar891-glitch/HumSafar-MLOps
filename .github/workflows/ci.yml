name: Lightweight application CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-ci.txt
      - run: python -m pip install -r backend/requirements-ci.txt
      - name: Lightweight syntax checks
        run: python -m compileall -q backend tests/ci
      - name: Data-free Python/API/routing/consensus tests
        run: python -m unittest discover -s tests/ci -v
      - name: Validate DAG layout without fetching data or training
        run: python -c "import yaml; from backend.mlops.definitions import validate_layout; print(validate_layout(yaml.safe_load(open('dvc.yaml'))))"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
