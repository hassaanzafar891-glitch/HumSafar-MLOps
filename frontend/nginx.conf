resolver 127.0.0.11 valid=10s ipv6=off;
upstream humsafar_api {
    zone humsafar_api 64k;
    server backend:8000 resolve;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Raw Nginx request/error lines may contain URLs, queries or private IDs.
    # Request telemetry comes from the backend's sanitized JSON logger instead.
    access_log off;
    error_log /dev/null;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api { return 308 /api/; }
    location /api/ {
        # Trailing slash removes /api/, matching the existing Vite proxy.
        proxy_pass http://humsafar_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace, never append, an untrusted browser-supplied forwarding header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_intercept_errors off;
    }
    # Existing OpenAPI OAuth token URL is absolute. Preserve POST via same-origin redirect.
    location = /auth/login { return 307 /api/auth/login; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
